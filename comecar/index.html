<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090e22" />
    <meta name="description" content="Escreva seu nome e entre na jornada de manifestação divina." />
    <title>Hora de Prosperar — Sua Jornada de Manifestação</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="/src/main.js" defer></script>
  </head>
  <body class="page page-journey page-start">
    <main class="journey-card">
      <img class="journey-logo" src="/assets/logo.webp" alt="Hora de Prosperar" width="516" height="483" />
      <h1>Deus não te trouxe aqui por acaso.</h1>
      <p class="journey-promise">Hoje, a prosperidade preparada em seu nome é liberada.</p>
      <p class="journey-invitation">Escreva seu nome abaixo e entre naquilo que foi preparado para você.</p>
      <form id="journey-form" novalidate>
        <label class="visually-hidden" for="journey-name">Digite seu nome</label>
        <input id="journey-name" name="name" type="text" placeholder="Digite seu nome" autocomplete="given-name" maxlength="80" required />
        <p class="field-hint">Digite seu nome para começar sua jornada de manifestação.</p>
        <p class="field-error" id="name-error" role="alert" hidden>Digite seu nome para continuar.</p>
        <button class="button button-gold journey-submit" type="submit">Começar minha Jornada</button>
      </form>
    </main>
  </body>
</html>
