<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090e22" />
    <meta name="description" content="Repita a frase em voz alta antes de continuar sua jornada." />
    <title>Hora de Prosperar — Sua Jornada de Manifestação</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="/src/main.js" defer></script>

  <body class="page page-journey page-phrase">
    <main class="journey-card phrase-card">
      <h1><span id="visitor-name">Você</span>, antes de continuarmos...</h1>
      <p class="phrase-instruction">Repita esta frase em voz alta:</p>
      <blockquote class="journey-quote">“A vida dos meus sonhos começa com a minha escolha.”</blockquote>
      <p class="phrase-reminder">Só clique em continuar após repeti-la em voz alta.</p>
      <button class="button button-gold journey-submit" type="button" disabled aria-disabled="true" title="A próxima etapa não foi observada na referência.">Continuar Jornada</button>
    </main>
  </body>
